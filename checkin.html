<style>
:root{--azul:#1991D0;--accion:#136CD6;--accion-h:#0F58B0;--tinta:#1F2A33;--suave:#555656;--muted:#6B6E70;--niebla:#EAF5FC;--linea:#D9DBDB;--ok:#1E7A46;--ok-s:#E7F5EC}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--tinta);background:var(--niebla);min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
header{background:var(--azul);padding:22px 16px 64px;text-align:center}header img{width:170px;height:auto}
main{flex:1;padding:0 16px 32px}
.card{max-width:460px;margin:-44px auto 0;background:#fff;border-radius:24px;padding:26px 22px 24px;box-shadow:0 10px 30px rgba(15,60,100,.12)}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accion)}
h1{margin:6px 0 2px;font-size:30px;line-height:1.1;font-weight:800}
.vuelo{margin:0 0 20px;color:var(--suave);font-size:16px}
.dato{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:0 0 10px;padding:14px 16px;border:1px solid var(--linea);border-radius:16px;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer}
.dato small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dato b{display:block;font-size:26px;font-weight:700;letter-spacing:.06em;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;word-break:break-all}
.dato span.c{flex:none;font-size:14px;font-weight:600;color:var(--accion)}
.dato.ok{border-color:var(--ok);background:var(--ok-s)}.dato.ok span.c{color:var(--ok)}
.ir{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;min-height:64px;padding:14px 18px;border:0;border-radius:18px;background:var(--accion);color:#fff;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-decoration:none}
.ir:hover{background:var(--accion-h)}.ir svg{width:24px;height:24px;flex:none}
.ayuda{margin:14px 0 0;font-size:15px;line-height:1.45;color:var(--suave);text-align:center}
.estado{min-height:22px;margin:12px 0 0;text-align:center;font-weight:600;color:var(--ok)}
footer{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 22px}footer a{color:var(--accion);text-decoration:none}
[hidden]{display:none!important}
</style></head><body>

    });
  });
})();
</script>
