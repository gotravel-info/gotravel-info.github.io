<meta property="og:type" content="website"><meta property="og:site_name" content="Go Travel"><meta property="og:title" content="Tus documentos de viaje"><meta property="og:description" content="Abre aquí tus documentos de viaje: tiquetes, vouchers, itinerario y asistencia, en un solo lugar."><meta property="og:image" content="https://gotravel-info.github.io/compartir.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&display=swap">
<style>
:root{--azul:#1991D0;--accion:#136CD6;--accion-h:#0F58B0;--tinta:#1F2A33;--suave:#555656;--muted:#6B6E70;--niebla:#EAF5FC;--nube:#F4F6F7;--linea:#D9DBDB;--ok:#1E7A46;--ok-s:#E7F5EC;--mal:#C2352B;--mal-s:#FDECEA}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Jost,system-ui,sans-serif;color:var(--tinta);background:var(--nube);min-height:100vh;min-height:100svh;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ico{width:22px;height:22px;flex:none}
[hidden]{display:none!important}
/* Cabecera */
.cab{position:relative;overflow:hidden;background:var(--azul);color:#fff;padding:20px 16px 76px}
.cab .orb{position:absolute;width:560px;right:-180px;top:-120px;fill:none;stroke:rgba(255,255,255,.16);stroke-width:1.4;pointer-events:none}
.cab-in{position:relative;max-width:720px;margin:0 auto}
.cab img.logo{width:150px;height:auto;display:block;margin-bottom:26px}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.cab .eyebrow{color:#fff;opacity:.92}
.cab h1{overflow-wrap:anywhere;margin:6px 0 6px;font-size:clamp(30px,7vw,44px);line-height:1.05;font-weight:800}
.cab .sub{margin:0;font-size:18px;font-weight:500}
.cab .cod{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:14px;font-weight:600;letter-spacing:.04em}
main{max-width:720px;margin:-52px auto 0;padding:0 16px 32px;position:relative}
.pax{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(15,60,100,.10);display:flex;gap:12px;align-items:center}
.pax .ico{color:var(--accion)}.pax small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.pax>div{min-width:0}.pax b{font-size:17px;overflow-wrap:anywhere}
h2{margin:26px 4px 10px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tarjeta{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:20px;padding:16px;margin:0 0 10px;cursor:pointer}
.tarjeta:hover{border-color:var(--accion)}
.t-ico{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--niebla);color:var(--accion)}.t-ico .ico{width:26px;height:26px}
.t-txt{flex:1;min-width:0;overflow-wrap:anywhere}.t-txt b{display:block;font-size:18px;line-height:1.2}.t-txt .t-sub{display:block;color:var(--suave);font-size:15px;margin-top:2px}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-width:0}.t-chips i{display:block;max-width:100%;min-width:0;white-space:normal;overflow-wrap:anywhere;font-style:normal;font-size:13px;line-height:1.3;font-weight:600;padding:4px 10px;border-radius:12px;background:var(--nube);color:var(--tinta)}
.t-ir{flex:none;color:var(--muted)}
.ayuda{margin:22px 4px 0;color:var(--suave);font-size:15px;line-height:1.5;text-align:center}
.asesor{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:18px;border-radius:18px;background:var(--accion);color:#fff;font-size:18px;font-weight:700;text-decoration:none}
.asesor:hover{background:var(--accion-h)}
footer{text-align:center;font-size:13px;color:var(--muted);padding:6px 16px 24px}footer a{color:var(--accion);text-decoration:none}
/* Estados */
.aviso{max-width:460px;margin:0 auto;background:#fff;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(15,60,100,.10)}
.aviso h3{margin:10px 0 6px;font-size:22px}.aviso p{margin:0;color:var(--suave);line-height:1.5}
.aviso .ico{width:40px;height:40px;color:var(--accion)}
.giro{width:34px;height:34px;border-radius:50%;border:3px solid var(--niebla);border-top-color:var(--accion);animation:g 1s linear infinite;margin:0 auto}@keyframes g{to{transform:rotate(360deg)}}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.pin input{width:100%;max-width:220px;text-align:center;font-size:32px;letter-spacing:.5em;padding:12px 8px 12px 20px;border:1.5px solid var(--linea);border-radius:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
.pin input:focus{outline:3px solid var(--niebla);border-color:var(--accion)}
.b-pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 26px;border:0;border-radius:16px;background:var(--accion);color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-decoration:none}
.b-pri:hover{background:var(--accion-h)}
.b-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1.5px solid var(--linea);border-radius:14px;background:#fff;color:var(--accion);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.error{color:var(--mal);font-weight:600;min-height:22px;margin:8px 0 0}
/* Ventana del documento */
.vent{position:fixed;inset:0;z-index:20;background:var(--nube);display:flex;flex-direction:column}
.v-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--linea)}
.v-bar b{flex:1;min-width:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-x{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:var(--nube);cursor:pointer}
.v-cuerpo{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.v-in{max-width:720px;margin:0 auto}
.res{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.res h3{margin:0 0 12px;font-size:20px;overflow-wrap:anywhere}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
.datos div{min-width:0}.datos dt{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.datos dd{margin:2px 0 0;font-size:17px;font-weight:500;word-break:break-word}
.tels{display:grid;gap:8px;margin-top:14px}
.tel{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:12px 14px;border-radius:14px;background:var(--niebla);text-decoration:none;color:var(--tinta)}
.tel span{font-size:15px;min-width:0}.tel b{font-size:17px;color:var(--accion);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.cob{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}.cob td{overflow-wrap:anywhere;padding:9px 0;border-top:1px solid var(--linea);vertical-align:top}.cob td:last-child{text-align:right;font-weight:600;padding-left:12px}
.instr{margin:14px 0 0;color:var(--suave);line-height:1.5;white-space:pre-line}
.cks{display:grid;gap:8px;margin-top:14px}
.qr{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;text-align:center}
.qr svg{width:min(78vw,320px);height:auto;display:block;margin:0 auto}
.qr p{margin:12px 0 0;color:var(--suave)}
.doc-acc{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.hoja{display:block;width:100%;height:auto;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(15,60,100,.10);margin:0 0 12px}
.marco{width:100%;height:78vh;border:0;border-radius:16px;background:#fff;display:block}
@media (max-width:420px){.datos{grid-template-columns:1fr}.tarjeta{gap:12px;padding:14px}.t-ico{width:42px;height:42px;border-radius:13px}.t-ico .ico{width:22px;height:22px}.t-txt b{font-size:17px}}
</style></head><body>

    if (tel) html += '<a class="asesor" href="https://wa.me/' + (tel.length === 10 ? '57' + tel : tel) + '?text=' + encodeURIComponent('Hola, tengo una pregunta sobre mis documentos de viaje ' + (M.id || '') + '.') + '" target="_blank" rel="noopener">' + ico('chat') + '<span>Escríbele a ' + esc((M.asesor && M.asesor.nombre) || 'tu asesor') + '</span></a>';
    html += '<p class="ayuda">Guarda este enlace. Después de abrirlo una vez con internet, tus documentos también se ven sin conexión.</p>';
    $('contenido').innerHTML = html; $('contenido').hidden = false;
    $('contenido').addEventListener('click', function (ev) { var t = ev.target.closest('.tarjeta'); if (t) verItem(t.dataset.id); });
  }

  // ── Ventana de un documento ──
  var urls = [];
  function cerrar() { $('vent').hidden = true; document.body.style.overflow = ''; urls.forEach(function (u) { URL.revokeObjectURL(u); }); urls = []; $('v-in').innerHTML = ''; if (location.hash.indexOf('~') > 0) history.back(); }
  $('v-x').addEventListener('click', cerrar);
  addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('vent').hidden) cerrar(); });
  addEventListener('popstate', function () { if (!$('vent').hidden && location.hash.indexOf('~') < 0) { $('vent').hidden = true; document.body.style.overflow = ''; $('v-in').innerHTML = ''; } });

  function verItem(id) {
    var x = (M.items || []).filter(function (i) { return i.id === id; })[0]; if (!x) return;
    $('v-t').textContent = x.titulo; $('vent').hidden = false; document.body.style.overflow = 'hidden'; $('v-cuerpo').scrollTop = 0;
    history.pushState(null, '', location.href.split('~')[0] + '~' + id);
    var h = '';
    if (x.qr && window.qrcode) {
      try { var q = qrcode(0, 'M'); q.addData(x.qr); q.make(); h += '<div class="qr">' + q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '<p>Muestra este código en la entrada. Sube el brillo de tu pantalla.</p></div>'; } catch (e) {}
    }
    var res = '';
    if ((x.datos || []).length) res += '<dl class="datos">' + x.datos.map(function (d) { return '<div><dt>' + esc(d.k) + '</dt><dd>' + esc(d.v) + '</dd></div>'; }).join('') + '</dl>';
    if ((x.ck || []).length) res += '<div class="cks">' + x.ck.map(function (c) { return '<a class="b-pri" href="' + esc(c.u) + '" rel="noopener">' + ico('avion') + '<span>Check-in ' + esc(c.n) + (c.v ? ' · ' + esc(c.v) : '') + '</span></a>'; }).join('') + '</div>';
    if ((x.tels || []).length) res += '<div class="tels">' + x.tels.map(function (t) { var wa = /whats/i.test(t.k + ' ' + t.n), num = String(t.n).replace(/[^\d+]/g, ''); return '<a class="tel" href="' + (wa ? 'https://wa.me/' + num.replace(/\D/g, '') : 'tel:' + num) + '"' + (wa ? ' target="_blank" rel="noopener"' : '') + '><span>' + esc(t.k || 'Teléfono') + '</span><b>' + ico(wa ? 'chat' : 'telefono') + ' ' + esc(t.n) + '</b></a>'; }).join('') + '</div>';
    if ((x.cob || []).length) res += '<table class="cob"><tbody>' + x.cob.map(function (c) { return '<tr><td>' + esc(c.k) + '</td><td>' + esc(c.v) + '</td></tr>'; }).join('') + '</tbody></table>';
    if (x.instr) res += '<p class="instr">' + esc(x.instr) + '</p>';
    if (res) h += '<div class="res"><h3>' + esc(x.sub || x.titulo) + '</h3>' + res + '</div>';
    if (x.archivo) h += '<div id="doc-zona"><div class="aviso"><div class="giro" aria-hidden="true"></div><p style="margin-top:10px">Abriendo el documento…</p></div></div>';
    $('v-in').innerHTML = h;
    if (x.archivo) cargarArchivo(x);
  }
  function cargarArchivo(x) {
    var a = x.archivo, n = a.partes || 1, ps = [];
    for (var i = 0; i < n; i++) ps.push(traer('v/' + carpeta + '/' + x.id + (i ? '.' + i : '') + '.bin'));
    Promise.all(ps).then(function (partes) {
      var total = partes.reduce(function (s, p) { return s + p.length; }, 0), todo = new Uint8Array(total), o = 0;
      partes.forEach(function (p) { todo.set(p, o); o += p.length; });
      return descifrar(todo, carpeta + '/' + x.id);
    }).then(function (bytes) {
      var blob = new Blob([bytes], { type: a.mime || 'application/octet-stream' }), url = URL.createObjectURL(blob); urls.push(url);
      var zona = $('doc-zona'); if (!zona) return;
      var acc = '<div class="doc-acc"><a class="b-sec" href="' + url + '" download="' + esc(a.nombre || 'documento') + '">' + ico('descargar') + '<span>Descargar</span></a>' + (/pdf/.test(a.mime) ? '<a class="b-sec" href="' + url + '" target="_blank" rel="noopener">' + ico('compartir') + '<span>Abrir aparte</span></a>' : '') + '</div>';
      if (/html/.test(a.mime)) { zona.innerHTML = acc + '<iframe class="marco" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" title="' + esc(x.titulo) + '" src="' + url + '"></iframe>'; return; }
      if (/^image\//.test(a.mime)) { zona.innerHTML = acc + '<img class="hoja" alt="' + esc(x.titulo) + '" src="' + url + '">'; return; }
      if (/pdf/.test(a.mime)) { zona.innerHTML = acc + '<div id="hojas"></div>'; return pintarPdf(bytes, $('hojas')); }
      zona.innerHTML = acc;
    }).catch(function () { var z = $('doc-zona'); if (z) z.innerHTML = '<div class="aviso"><h3>No pudimos abrir este documento</h3><p>Revisa tu conexión e intenta de nuevo. Si sigue igual, escríbele a tu asesor.</p></div>'; });
  }
  var pdfjsP = null;
  function cargar(src) { return new Promise(function (ok, mal) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }); }
  function pdfjs() {
    var base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return pdfjsP || (pdfjsP = (window.pdfjsWorker ? Promise.resolve() : cargar(base + 'pdf.worker.min.js')).then(function () { return window.pdfjsLib ? null : cargar(base + 'pdf.min.js'); }).then(function () { pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; return pdfjsLib; }).catch(function (e) { pdfjsP = null; throw e; }));
  }
  function pintarPdf(bytes, dest) {
    return pdfjs().then(function (lib) { return lib.getDocument({ data: bytes, isEvalSupported: false }).promise; }).then(function (pdf) {
      var ancho = Math.min(dest.clientWidth || 360, 720) * Math.min(window.devicePixelRatio || 1, 2), cadena = Promise.resolve();
      for (var n = 1; n <= pdf.numPages; n++) (function (n) {
        cadena = cadena.then(function () { return pdf.getPage(n); }).then(function (p) {
          var v1 = p.getViewport({ scale: 1 }), vp = p.getViewport({ scale: ancho / v1.width }), c = document.createElement('canvas');
          c.width = Math.round(vp.width); c.height = Math.round(vp.height); c.className = 'hoja'; dest.appendChild(c);
          return p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        });
      })(n);
      return cadena;
    });
  }
})();
